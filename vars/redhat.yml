base_journal_conf: /usr/lib/systemd/journald.conf
base_microcode_amd: linux-firmware
base_microcode_intel: microcode_ctl
base_ntp_conf: /etc/chrony.conf
base_ntp_service: chronyd
base_ntp_sources_dir: /etc/chrony.d
base_packages_distribution:
  - sudo
  - vim-enhanced
  - which
  - gnupg
  - openssl
  - logrotate
  - nfs-utils
  - net-tools
  - nano
  - epel-release
base_update_trust_cert: /bin/update-ca-trust
